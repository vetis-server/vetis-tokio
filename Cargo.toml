[package]
name = "vetis-tokio"
version = "0.1.1"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2021"
repository = "https://github.com/vetis-server/vetis-tokio"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server with tokio runtime"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "tokio", "rest-server"]
publish = true
rust-version = "1.75.0"

[package.metadata.docs.rs]
all-features = true

[package.metadata.wix]
upgrade-guid = "76DF79DF-E1F9-40A7-89D1-3190562C7851"
path-guid = "FEA82F70-7E57-447F-A361-76FB5E25BA5F"
license = false
eula = false

[features]
default = [
  "http1",
  "http2",
  #"http3",
  "rust-tls"
]

rust-tls = ["tokio-rustls", "rustls", "rustls-provider"]

rustls-provider = ["__rustls_awc_lc_rs"]
__rustls_awc_lc_rs = ["futures-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["futures-rustls/ring", "quinn/rustls-ring"]

http1 = [
  "hyper/http1",
  "hyper/server",
  "hyper-util/server",
  "hyper-util/tokio",
  "hyper-body-utils/generic",
  "hyper-util/http1",
]
http2 = [
  "hyper/http2",
  "hyper/server",
  "hyper-util/server",
  "hyper-util/tokio",
  "hyper-body-utils/generic",
  "hyper-util/http2",
]
http3 = [
  "dep:h3",
  "dep:h3-quinn",
  "hyper/server",
  "hyper-util/server",
  "hyper-body-utils/generic",
  "hyper-body-utils/generic-h3",
  "quinn/runtime-tokio",
]

[dependencies]
async-lock = "3.4.1"
base64 = { version = "0.23.1", default-features = false }
bytes = "1.12.1"
clap = { version = "4.6.6", default-features = false, features = [
  "std",
  "derive",
] }
env_logger = "0.11.9"
futures-lite = { version = "2.6.1", default-features = false }
futures-rustls = { version = "0.26.0", optional = true, default-features = false }
futures-util = { version = "0.3.32" }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
http = "1.4.2"
http-body-util = { version = "0.1.3" }
hyper = { version = "1.10.1", optional = true, default-features = false }
hyper-body-utils = { version = ">= 0.1.14", optional = true, default-features = false }
hyper-util = { version = "0.1.20", optional = true, default-features = false }
log = "0.4.34"
mimalloc = "0.1.52"
peekable = { version = "0.6.1", features = ["tokio"] }
quinn = { version = "0.11.11", optional = true, default-features = false }
radix_trie = { version = "0.3.0", default-features = false }
rand = { version = "0.10.2", default-features = false }
regex = { version = "1.12.4", default-features = false }
rustls = { version = "0.23.40", optional = true, default-features = false }
serde = "1.0.228"
serde_yaml_ng = "0.10.0"
socket2 = "0.6.4"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.52.3", features = [
  "fs",
  "signal",
  "net",
  "rt-multi-thread",
], default-features = false }
tokio-rustls = { version = "0.26.0", optional = true, default-features = false }
tokio-util = { version = "0.7.18", features = ["io"], default-features = false }
typetag = "0.2.22"
url = "2.5.7"
vetis = { version = "0.1.6", default-features = false }

[dev-dependencies]
deboa = { version = "0.1.5-beta.1" }
deboa-tokio = { version = "0.1.4-beta.1", default-features = false, features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
tokio = { version = "1.52.3", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }
vetis-macros = { version = "0.1.2" }
