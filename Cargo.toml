[package]
name = "vetis-tokio"
version = "0.1.2"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/vetis-server/vetis-tokio"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server with tokio runtime"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "tokio", "rest-server"]
publish = true
rust-version = "1.86.0"

[lints.cargo]
unused_dependencies = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)']}

[package.metadata.cargo-machete]
ignored = ["futures-rustls", "peekable"]

[package.metadata.docs.rs]
all-features = true

[features]
default = [
  "http2",
  #"http3",
  "rust-tls"
]

rust-tls = ["dep:tokio-rustls", "dep:rustls", "rustls-provider"]

rustls-provider = ["__rustls_awc_lc_rs"]
__rustls_awc_lc_rs = ["tokio-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["tokio-rustls/ring", "quinn/rustls-ring"]

http2 = ["hyper/http2", "hyper-util/http2"]
http3 = [
  "dep:h3",
  "dep:h3-quinn",
  "hyper-body-utils/h3",
  "quinn/runtime-tokio",
]

[dependencies]
bytes = "1.12.1"
cel = "0.16.0"
compact_str = { version = "0.10.0", features = ["serde", "smallvec"] }
crossfire = { version = "3.1.22", features = ["tokio"] }
futures-util = { version = "0.3.32" }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
http = "1.5.0"
http-body-util = { version = "0.1.3" }
hyper = { version = "1.12.0", default-features = false, features = [
  "http1",
  "server",
] }
hyper-body-utils = { version = "0.1.18", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = [
  "server",
  "http1",
  "tokio",
] }
log = "0.4.34"
papaya = "0.2.5"
peekable = { version = "0.6.2", features = ["tokio"] }
quinn = { version = "0.11.12", optional = true, default-features = false }
rand = { version = "0.10.3", default-features = false }
rustls = { version = "0.23.46", optional = true, default-features = false, features = [
  "hashbrown",
  "tls12",
  "prefer-post-quantum",
] }
serde = "1.0.228"
tokio = { version = "1.54.1", features = [
  "fs",
  "signal",
  "net",
  "macros",
  "rt-multi-thread",
], default-features = false }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false }
typetag = "0.2.22"
vetis = { path = "../vetis/vetis", default-features = false, features = ["multi-threaded"] }
vetis-matchers = { path = "../vetis-matchers" }

[dev-dependencies]
caramelo = "0.1.5"
deboa = { version = "0.1.5" }
deboa-tokio = { version = "0.1.4", default-features = false, features = [
  "http2",
  "http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
tokio = { version = "1.54.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }
vetis-macros = { path = "../vetis/vetis-macros" }

#[patch.crates-io]
#vetis = { path = "../vetis/vetis" }
#vetis-macros = { path = "../vetis/vetis-macros" }
#vetis-matchers = { path = "../vetis-matchers" }
