[package]
name = "vetis-tokio"
version = "0.1.2-beta.7"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/vetis-server/vetis-tokio"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server with tokio runtime"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "tokio", "rest-server"]
publish = true
rust-version = "1.85.0"

[package.metadata.cargo-machete]
ignored = ["h3-webtransport", "peekable", "futures-rustls"]

[package.metadata.docs.rs]
all-features = true

[features]
default = [
  "http2",
  "http3",
  "rust-tls"
]

rust-tls = ["tokio-rustls", "rustls", "rustls-provider"]

rustls-provider = ["__rustls_awc_lc_rs"]
__rustls_awc_lc_rs = ["futures-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["futures-rustls/ring", "quinn/rustls-ring"]

http2 = ["hyper/http2", "hyper-util/http2"]
http3 = [
  "dep:h3",
  "dep:h3-quinn",
  "dep:h3-webtransport",
  "hyper-body-utils/h3",
  "quinn/runtime-tokio",
]

[dependencies]
bytes = "1.12.1"
crossfire = { version = "3.1.20", features = ["tokio"] }
futures-rustls = { version = "0.26.0", optional = true, default-features = false }
futures-util = { version = "0.3.32" }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
h3-webtransport = { version = "0.1.2", optional = true, default-features = false }
http = "1.5.0"
http-body-util = { version = "0.1.3" }
hyper = { version = "1.12.0", default-features = false, features = [
  "http1",
  "server",
] }
hyper-body-utils = { version = "0.1.18", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = [
  "server",
  "http1",
  "tokio",
] }
log = "0.4.34"
papaya = "0.2.5"
peekable = { version = "0.6.2", features = ["future"] }
quinn = { version = "0.11.12", optional = true, default-features = false }
rand = { version = "0.10.3", default-features = false }
rustls = { version = "0.23.46", optional = true, default-features = false, features = [
  "hashbrown",
  "tls12",
  "prefer-post-quantum",
] }
tokio = { version = "1.53.2", features = [
  "fs",
  "signal",
  "net",
  "macros",
  "rt-multi-thread",
], default-features = false }
tokio-rustls = { version = "0.26.5", optional = true, default-features = false }
vetis = { version = "0.1.7-beta.5", default-features = false }

[dev-dependencies]
caramelo = "0.1.5"
deboa = { version = "0.1.5-beta.5" }
deboa-tokio = { version = "0.1.4-beta.5", default-features = false, features = [
  "http2",
  "http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
tokio = { version = "1.52.3", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }
