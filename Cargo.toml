[package]
name = "vetis-tokio"
version = "0.1.2-beta.5"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/vetis-server/vetis-tokio"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server with tokio runtime"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "tokio", "rest-server"]
publish = true
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true

[features]
default = [
  "http2",
  #"http3",
  "rust-tls"
]

rust-tls = ["tokio-rustls", "rustls", "rustls-provider"]

rustls-provider = ["__rustls_awc_lc_rs"]
__rustls_awc_lc_rs = ["futures-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["futures-rustls/ring", "quinn/rustls-ring"]

http2 = ["hyper/http2", "hyper-util/http2"]
http3 = [
  "dep:h3",
  "dep:h3-quinn",
  "hyper-body-utils/generic-h3",
  "quinn/runtime-tokio",
]

[dependencies]
base64 = { version = "0.23.1", default-features = false }
bytes = "1.12.1"
crossfire = { version = "3.1.20", features = ["tokio"] }
futures-lite = { version = "2.6.1", default-features = false }
futures-rustls = { version = "0.26.0", optional = true, default-features = false }
futures-util = { version = "0.3.32" }
h3 = { version = "0.0.8", optional = true, default-features = false }
h3-quinn = { version = "0.0.10", optional = true, default-features = false }
http = "1.5.0"
http-body-util = { version = "0.1.3" }
hyper = { version = "1.10.1", default-features = false, features = [
  "http1",
  "server",
] }
hyper-body-utils = { version = "0.1.17", default-features = false, features = [
  "generic",
] }
hyper-util = { version = "0.1.21", default-features = false, features = [
  "server",
  "http1",
  "tokio",
] }
log = "0.4.34"
logforth = { version = "0.30.1", features = ["starter-log"] }
papaya = "0.2.5"
patricia_tree = "0.10.2"
quinn = { version = "0.11.12", optional = true, default-features = false }
rand = { version = "0.10.3", default-features = false }
regex = { version = "1.12.4", default-features = false }
rustls = { version = "0.23.45", optional = true, default-features = false, features = [
  "hashbrown",
  "tls12",
  "prefer-post-quantum",
] }
serde = "1.0.228"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.52.3", features = [
  "fs",
  "signal",
  "net",
  "macros",
  "rt-multi-thread",
], default-features = false }
tokio-rustls = { version = "0.26.5", optional = true, default-features = false }
typetag = "0.2.22"
#vetis = { path = "../vetis/vetis", default-features = false }
vetis = { version = "0.1.7-beta.4", default-features = false }

[dev-dependencies]
caramelo = "0.1.5"
#deboa = { path = "../deboa/deboa" }
deboa = { version = "0.1.5-beta.2" }
# deboa-tokio = { path = "../deboa-tokio/deboa-tokio", default-features = false, features = [
#   "http2",
#   #"http3",
#   "rust-tls",
#   "default-rustls-provider",
#   "default-rustls-verifier",
# ] }
deboa-tokio = { version = "0.1.4-beta.3", default-features = false, features = [
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
tokio = { version = "1.52.3", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }
vetis-log = { path = "../vetis-extras/vetis-log" }
vetis-macros = { path = "../vetis/vetis-macros" }
#vetis-macros = { version = "0.1.3-beta.4" }
